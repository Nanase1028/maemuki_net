<style>
:root{
  --main:#2b6cb0; --main-dark:#204e7d; --bg:#f2f6fa; --card:#ffffff;

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

.wrap{max-width:720px; margin:0 auto; padding:12px 12px 60px;}
header.top{background:var(--main); color:#fff; padding:14px 16px; text-align:center;}
header.top h1{font-size:1.05rem; margin:0; font-weight:600;}
.progress-outer{position:sticky; top:0; z-index:10; background:var(--bg); padding:8px 0 4px;}
.progress-bar{height:8px; background:#dbe4ee; border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:var(--main); width:0%; transition:width .3s;}
.progress-label{font-size:.75rem; color:var(--sub); text-align:right; margin-top:2px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 16px; margin:14px 0; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.card h2{font-size:1.05rem; margin:0 0 8px; color:var(--main-dark);}
.instruction{font-size:.9rem; background:var(--accent); border-radius:8px; padding:10px 12px; margin-bottom:14px; white-space:pre-wrap;}
.qa{border-top:1px solid var(--border); padding:14px 2px;}
.qa:first-of-type{border-top:none;}
.qa .qtext{font-size:.95rem; font-weight:600; margin-bottom:8px;}
.qa .qnum{color:var(--main); margin-right:6px;}
.opts{display:flex; flex-direction:column; gap:6px;}
.opts label{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:.92rem; background:#fff;}
.opts label:has(input:checked){border-color:var(--main); background:var(--accent); font-weight:600;}
.opts input[type=radio],.opts input[type=checkbox]{accent-color:var(--main); width:18px; height:18px; flex-shrink:0;}
.qa.unanswered{background:#fff5f5; border-radius:8px; outline:1px solid #f5b5b5;}
.qa.unanswered .qtext{color:var(--danger);}
.qa.unanswered .qtext::after{content:" ※未回答"; color:var(--danger); font-size:.8rem;}
.qa.flash{animation:flash 1.2s;}
@keyframes flash{0%,60%{background:#ffd9d9;}100%{background:#fff5f5;}}
input[type=text],input[type=number],select{width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:1rem;}
.btnrow{display:flex; gap:10px; margin-top:18px;}
button{flex:1; padding:14px; font-size:1rem; border:none; border-radius:10px; cursor:pointer; font-weight:600;}
.btn-next{background:var(--main); color:#fff;}
.btn-next:active{background:var(--main-dark);}
.btn-prev{background:#e2e8f0; color:var(--text); flex:0 0 30%;}
.btn-csv{background:#e2e8f0; color:var(--text); margin-top:10px;}
.err{color:var(--danger); font-size:.9rem; margin-top:14px; display:none; background:#fff5f5; border:1px solid #f5b5b5; border-radius:10px; padding:12px;}
.err .jump-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.err .jump-chip{display:inline-block; padding:5px 12px; border:1.5px solid var(--danger); color:var(--danger); background:#fff; border-radius:999px; font-size:.85rem; font-weight:700; cursor:pointer;}
.err .jump-chip:active{background:#ffd9d9;}
.note{font-size:.8rem; color:var(--sub); margin-top:8px;}
details.ref{margin:10px 0; font-size:.85rem;}
details.ref summary{cursor:pointer; color:var(--main); font-weight:600;}
details.ref table{border-collapse:collapse; width:100%; margin-top:8px; font-size:.8rem;}
details.ref th,details.ref td{border:1px solid var(--border); padding:4px 6px; text-align:left;}
.complete{text-align:center; padding:40px 16px;}
.complete .mark{font-size:3rem;}
.spinner{display:inline-block; width:22px; height:22px; border:3px solid #cbd5e1; border-top-color:var(--main); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.subhead{font-weight:700; margin:18px 0 6px; font-size:.95rem; color:var(--main-dark); border-left:4px solid var(--main); padding-left:8px;}
</style>

/* ============ 回答の保存・復元 ============ */
function saveCurrent(){
  const sec = SECTIONS[state.idx];
  if(sec.custom === "intro"){
    state.meta.participant_id = (document.getElementById("pid")||{}).value?.trim() || "";
    state.meta.age = (document.getElementById("age")||{}).value || "";
    const sx = document.querySelector('input[name="sex"]:checked');
    state.meta.sex = sx ? sx.value : "";
    return;
  }
  document.querySelectorAll('#app input[type=radio]:checked').forEach(el=>{ state.answers[el.name] = el.value; });
  const cbGroups = {};
  document.querySelectorAll('#app input[type=checkbox]').forEach(el=>{
    if(!cbGroups[el.name]) cbGroups[el.name] = [];
    if(el.checked) cbGroups[el.name].push(el.value);
  });
  Object.keys(cbGroups).forEach(k=>{ state.answers[k] = cbGroups[k].join("；"); });
  document.querySelectorAll('#app input[type=text], #app input[type=number]').forEach(el=>{
    if(el.id) state.answers[el.id] = el.value.trim();
  });
}

function restoreAnswers(sec){
  if(sec.custom === "intro"){
    if(state.meta.participant_id) document.getElementById("pid").value = state.meta.participant_id;
    if(state.meta.age) document.getElementById("age").value = state.meta.age;
    if(state.meta.sex){ const el = document.querySelector('input[name="sex"][value="'+state.meta.sex+'"]'); if(el) el.checked = true; }
    return;
  }
  document.querySelectorAll('#app input[type=radio]').forEach(el=>{
    if(state.answers[el.name] !== undefined && state.answers[el.name] === el.value) el.checked = true;
  });
  document.querySelectorAll('#app input[type=checkbox]').forEach(el=>{
    const v = state.answers[el.name];
    if(v){ const parts = v.split("；"); if(parts.includes(el.value)) el.checked = true; }
  });
  document.querySelectorAll('#app input[type=text], #app input[type=number]').forEach(el=>{
    if(el.id && state.answers[el.id] !== undefined) el.value = state.answers[el.id];
  });
}

/* ============ バリデーション ============ */
function validate(){
  const sec = SECTIONS[state.idx];
  let ok = true;
  document.querySelectorAll("#app .qa").forEach(el=>el.classList.remove("unanswered"));
  if(sec.custom === "intro"){
    if(!state.meta.participant_id){ ok=false; document.getElementById("pid").closest(".qa").classList.add("unanswered"); }
    if(!state.meta.age){ ok=false; document.getElementById("age").closest(".qa").classList.add("unanswered"); }
    if(!state.meta.sex){ ok=false; document.querySelector('input[name="sex"]').closest(".qa").classList.add("unanswered"); }
    return ok;
  }
  if(sec.custom === "confirm") return true;
  document.querySelectorAll("#app .qa[data-key]").forEach(qa=>{
    const key = qa.dataset.key;
    if(key === "sogs_borrow") return; // 任意
    const radio = qa.querySelector('input[type=radio]');
    const cb = qa.querySelector('input[type=checkbox]');
    const txt = qa.querySelector('input[type=text], input[type=number]');
    if(radio){
      if(!qa.querySelector('input[type=radio]:checked')){ ok=false; qa.classList.add("unanswered"); }
    } else if(cb){
      const checkedAny = qa.querySelector('input[type=checkbox]:checked');
      const otherTxt = qa.querySelector('input[type=text]');
      if(!checkedAny && !(otherTxt && otherTxt.value.trim())){ ok=false; qa.classList.add("unanswered"); }
    } else if(txt){
      if(!txt.value.trim()){ ok=false; qa.classList.add("unanswered"); }
    }
  });
  return ok;
}

/* ============ 未回答表示・ジャンプ ============ */
function chipLabel(qa){
  if(qa.dataset.label) return qa.dataset.label;
  const n = qnumOf(qa.dataset.key || "");
  return n ? n : (qa.dataset.key || "?");
}

function showErrors(scroll){
  const err = document.getElementById("err");
  if(!err) return;
  const list = document.querySelectorAll("#app .qa.unanswered");
  if(list.length === 0){ err.style.display = "none"; errVisible = false; return; }
  let h = '未回答の項目が <b>'+list.length+'件</b> あります。番号を押すとその項目に移動できます。<div class="jump-list">';
  list.forEach(qa=>{
    h += '<span class="jump-chip" onclick="jumpTo(\''+qa.dataset.key+'\')">'+esc(chipLabel(qa))+'</span>';
  });
  h += '</div>';
  err.innerHTML = h;
  err.style.display = "block";
  errVisible = true;
  if(scroll){
    const first = document.querySelector("#app .qa.unanswered");
    if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function jumpTo(key){
  const qa = document.querySelector('#app .qa[data-key="'+key+'"]');
  if(!qa) return;
  qa.scrollIntoView({behavior:"smooth", block:"center"});
  qa.classList.remove("flash");
  void qa.offsetWidth; // アニメーション再生のためのリフロー
  qa.classList.add("flash");
  setTimeout(()=>qa.classList.remove("flash"), 1300);
}

/* ============ ナビゲーション ============ */
function goPrev(){ saveCurrent(); state.idx--; render(); }
function goNext(){
  saveCurrent();
  if(!validate()){
    showErrors(true);
    return;
  }
  if(SECTIONS[state.idx].custom === "confirm"){ submit(); return; }
  state.idx++;
  render();
}

/* ============ 採点 ============ */
function num(k){ const v = state.answers[k]; return v === undefined || v === "" ? NaN : Number(v); }
function sum(prefix, n){
  let s = 0;
  for(let i=1;i<=n;i++){ s += num(prefix+"_"+i); }
  return s;
}
function val(prefix,i){ return num(prefix+"_"+i); }
function sumItems(prefix, idxs, revIdxs, maxPlus1){
  let s = 0;
  idxs.forEach(i=>{ s += (revIdxs && revIdxs.includes(i)) ? (maxPlus1 - val(prefix,i)) : val(prefix,i); });
  return s;
}
function round2(x){ return Math.round(x*100)/100; }

function computeScores(){
  const sc = {};
  // CIUS: 0-4 × 14項目 合計
  sc.cius_total = sum("cius", 14);
  // DQ: はい=1 合計（資料基準: 5点超でネット依存疑い）
  sc.dq_total = sum("dq", 8);
  // IAT: 合計（40点以上傾向 / 70点以上疑い）
  sc.iat_total = sum("iat", 20);
  // SAS-SV-J: 合計
  sc.sas_total = sum("sas", 10);
  // IGDT-10: 「よくあった(2)」=1点。問9・問10は同一診断項目（どちらかが2なら1点）。0-9点、5点以上でIGD疑い
  let igdt = 0;
  for(let i=1;i<=8;i++){ if(val("igdt",i) === 2) igdt++; }
  if(val("igdt",9) === 2 || val("igdt",10) === 2) igdt++;
  sc.igdt_total = igdt;
  sc.igdt_rawsum = sum("igdt", 10);
  // IGDS9-SF: 合計 9-45
  sc.igds_total = sum("igds", 9);
  // GAMES: 合計（5点以上でゲーム障害疑い）
  sc.games_total = sum("games", 9);
  // SOCRATES-8(19項目) 下位尺度
  sc.socrates_recognition = sumItems("soc", [1,3,7,10,12,15,17]);
  sc.socrates_ambivalence = sumItems("soc", [2,6,11,16]);
  sc.socrates_takingsteps = sumItems("soc", [4,5,8,9,13,14,18,19]);
  // 過集中スケール: 合計
  sc.hyperfocus_total = sum("hf", 11);
  // BIS-11: 逆転(1,7,8,9,10,12,13,15,20,29,30)後の合計と下位尺度（Patton 1995）
  const bisRev = [1,7,8,9,10,12,13,15,20,29,30];
  sc.bis11_total = sumItems("bis11", Array.from({length:30},(_,i)=>i+1), bisRev, 5);
  sc.bis11_attention   = sumItems("bis11", [5,6,9,11,20,24,26,28], bisRev, 5);
  sc.bis11_motor       = sumItems("bis11", [2,3,4,16,17,19,21,22,23,25,30], bisRev, 5);
  sc.bis11_nonplanning = sumItems("bis11", [1,7,8,10,12,13,14,15,18,27,29], bisRev, 5);
  // BIS/BAS: BIS(1r,6,10,13,15,18r,20) / BAS下位（駆動2,7,9,17・刺激探求4,8,12,16・報酬反応3,5,11,14,19）
  const bbRev = [1,18];
  sc.bisbas_bis = sumItems("bisbas", [1,6,10,13,15,18,20], bbRev, 5);
  sc.bisbas_bas_drive  = sumItems("bisbas", [2,7,9,17]);
  sc.bisbas_bas_fun    = sumItems("bisbas", [4,8,12,16]);
  sc.bisbas_bas_reward = sumItems("bisbas", [3,5,11,14,19]);
  sc.bisbas_bas_total = sc.bisbas_bas_drive + sc.bisbas_bas_fun + sc.bisbas_bas_reward;
  // AUDIT: 合計 0-40
  sc.audit_total = sum("audit", 10);
  // FTND: 合計 0-10
  sc.ftnd_total = sum("ftnd", 6);
  // SOGS: 20点満点
  let sogs = 0;
  const q1 = num("sogs_q1"); if(q1 >= 2) sogs++;            // たいてい/いつも取り返そうとする
  const q2 = num("sogs_q2"); if(q2 >= 1) sogs++;            // 嘘をついた（「ない」以外）
  const q3 = num("sogs_q3"); if(q3 >= 1) sogs++;            // 問題（以前あった/ある）
  for(let i=4;i<=11;i++){ if(num("sogs_q"+i) === 1) sogs++; } // ある=1
  const borrow = (state.answers["sogs_borrow"]||"").split("；").filter(x=>x);
  sogs += borrow.length;                                     // 借入先 各1点（最大9）
  sc.sogs_total = sogs;
  sc.sogs_experience = num("sogs_exp");
  // IRI: 下位尺度（逆転: 5-x）
  const iriRev = [3,4,7,12,13,14,15,18,19];
  sc.iri_pt = sumItems("iri", [3,8,11,15,21,25,28], iriRev, 5);
  sc.iri_fs = sumItems("iri", [1,5,7,12,16,23,26], iriRev, 5);
  sc.iri_ec = sumItems("iri", [2,4,9,14,18,20,22], iriRev, 5);
  sc.iri_pd = sumItems("iri", [6,10,13,17,19,24,27], iriRev, 5);
  // TAS-20: 逆転(4,5,10,18,19) 合計と下位尺度
  const tasRev = [4,5,10,18,19];
  sc.tas_total = sumItems("tas", Array.from({length:20},(_,i)=>i+1), tasRev, 6);
  sc.tas_dif = sumItems("tas", [1,3,6,7,9,13,14], tasRev, 6);
  sc.tas_ddf = sumItems("tas", [2,4,11,12,17], tasRev, 6);
  sc.tas_eot = sumItems("tas", [5,8,10,15,16,18,19,20], tasRev, 6);
  // CFS: 逆転(2,3,5,10) 合計
  sc.cfs_total = sumItems("cfs", Array.from({length:12},(_,i)=>i+1), [2,3,5,10], 7);
  // REI: 合理性(1-20)・直観性(21-40)（逆転は項目文言に基づく）
  const reiRevR = [3,4,6,9,10,11,13,14,15,19];
  const reiRevE = [22,25,26,30,32,33,34,37,39];
  sc.rei_rational = sumItems("rei", Array.from({length:20},(_,i)=>i+1), reiRevR, 6);
  sc.rei_experiential = sumItems("rei", Array.from({length:20},(_,i)=>i+21), reiRevE, 6);
  // WHOQOL-26: 逆転(3,4,26)、領域平均と全体平均
  const qolRev = [3,4,26];
  const qv = i => qolRev.includes(i) ? 6 - val("qol",i) : val("qol",i);
  const mean = idxs => round2(idxs.reduce((a,i)=>a+qv(i),0) / idxs.length);
  sc.qol_physical = mean([3,4,10,15,16,17,18]);
  sc.qol_psych    = mean([5,6,7,11,19,26]);
  sc.qol_social   = mean([20,21,22]);
  sc.qol_environ  = mean([8,9,12,13,14,23,24,25]);
  sc.qol_overall  = mean([1,2]);
  sc.qol_mean26   = mean(Array.from({length:26},(_,i)=>i+1));
  return sc;
}

/* ============ 送信 ============ */
function buildPayload(){
  return {
    form_type: CONFIG.FORM_TYPE,
    submitted_at: new Date().toISOString(),
    participant_id: state.meta.participant_id,
    age: state.meta.age,
    sex: state.meta.sex,
    answers: state.answers,
    scores: computeScores()
  };
}

function submit(){
  const payload = buildPayload();
  app.innerHTML = '<div class="card complete"><span class="spinner"></span><p>送信中です。このままお待ちください…</p></div>';
  const finish = (ok) => showComplete(ok, payload);
  if(!CONFIG.GAS_URL || CONFIG.GAS_URL.indexOf("http") !== 0){ finish(false); return; }
  const timeout = new Promise(res=>setTimeout(()=>res({timeout:true}), 20000));
  Promise.race([
    fetch(CONFIG.GAS_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) }),
    timeout
  ]).then(r => finish(!(r && r.timeout))).catch(() => finish(false));
}

function showComplete(sent, payload){
  document.getElementById("pfill").style.width = "100%";
  document.getElementById("plabel").textContent = "完了";
  let h = '<div class="card complete"><div class="mark">✅</div><h2>ご回答ありがとうございました</h2>';
  h += '<p style="font-size:.92rem;">回答は以上で終了です。このページを閉じていただいて構いません。</p>';
  if(!sent){
    h += '<p style="font-size:.85rem; color:var(--danger);">※通信状況により回答データの自動送信が確認できませんでした。お手数ですが、下のボタンから回答ファイルを保存し、研究担当者にお渡しください。</p>';
    h += '<button type="button" class="btn-csv" onclick="downloadCSV()">回答ファイル（CSV）を保存する</button>';
  }
  h += '</div>';
  app.innerHTML = h;
  window._lastPayload = payload;
}

function downloadCSV(){
  const p = window._lastPayload;
  const flat = Object.assign(
    { form_type:p.form_type, submitted_at:p.submitted_at, participant_id:p.participant_id, age:p.age, sex:p.sex },
    p.answers, p.scores);
  const keys = Object.keys(flat);
  const escCsv = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const csv = "﻿" + keys.map(escCsv).join(",") + "\n" + keys.map(k=>escCsv(flat[k])).join(",");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "kaito_" + (p.participant_id||"noid") + "_" + p.submitted_at.slice(0,10) + ".csv";
  a.click();
}

render();
</script>
